<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Shift — UI Visual Reference</title>
<style>
:root{--forest:#173E32;--leaf:#299A61;--cream:#F6F7F1;--mint:#E9F5E9;--line:#DDE8DC;--muted:#64786D;--blue:#4D87A8;--amber:#D59A39;--red:#BB6450}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,Tahoma,sans-serif;background:var(--cream);color:#193B30;font-size:15px}body{overflow-x:hidden}a{color:inherit}.topbar{height:77px;background:#fff;border-bottom:1px solid var(--line);padding:0 45px;display:flex;align-items:center;gap:35px}.logo{display:flex;align-items:center;gap:12px;color:var(--forest);font-weight:850;font-size:26px;letter-spacing:-1px}.logo-dot{width:35px;height:35px;background:linear-gradient(160deg,#38B877,#105B3C);border-radius:16px 4px 18px 5px;transform:rotate(-24deg);position:relative}.logo-dot:after{content:' ';position:absolute;width:16px;height:2px;background:#e7f8dd;transform:rotate(45deg);left:9px;top:17px}.toplinks{display:flex;gap:28px;font-size:13px;color:#72837A}.toplinks span.active{font-weight:800;color:var(--forest)}.right-top{margin-left:auto;display:flex;align-items:center;gap:17px}.pill{background:var(--mint);border:1px solid #d4ebd8;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:#225a3e}.main{width:min(1280px,calc(100% - 66px));margin:31px auto 65px}.eyebrow{font-size:12px;text-transform:uppercase;font-weight:780;letter-spacing:2px;color:var(--leaf)}h1{margin:8px 0 11px;color:var(--forest);font-size:39px;letter-spacing:-1.8px;line-height:1.12}h2{margin:0 0 13px;font-size:23px;letter-spacing:-.6px}h3{margin:0 0 9px;font-size:16px}.muted{color:var(--muted)}.lead{color:#667a6d;font-size:16px;line-height:1.7}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 9px 35px rgba(18,68,40,.045)}.pale{background:linear-gradient(115deg,#E7F4E5,#F1F7EF);border-color:#deeedf}.outline{background:#fff;border:1px solid #cddbd0;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;color:var(--forest);display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:12px;background:linear-gradient(145deg,#38B578,#218A57);border:none;color:#fff;font-weight:800;box-shadow:0 4px 12px #218a5730;min-width:140px;font-size:13px}.buttons{display:flex;gap:12px;align-items:center;margin-top:20px}.two{display:grid;grid-template-columns:1.35fr .82fr;gap:23px}.two-even{display:grid;grid-template-columns:1fr 1fr;gap:24px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.smallcard{background:#f8fbf7;border:1px solid #e4ede4;border-radius:14px;padding:15px}.smallcard .name{font-size:11px;color:#6e8578;margin-bottom:10px}.smallcard .val{font-weight:850;font-size:17px;color:#204a38}.bar{height:8px;background:#E7EEE7;border-radius:999px;overflow:hidden;margin:11px 0}.bar>i{height:100%;display:block;border-radius:inherit;background:#2EAA68}.hint{display:flex;align-items:center;gap:8px;color:#62786a;font-size:11px}.badge{font-size:11px;font-weight:850;border-radius:99px;padding:6px 9px;display:inline-block;background:#E5F6E7;color:#197b47}.badge.blue{background:#e8f2f8;color:#3b81aa}.badge.amber{background:#FFF3DA;color:#9b6a20}.badge.grey{background:#eff1ef;color:#6a7870}.map{position:relative;background:#B3C9A0;border-radius:19px;overflow:hidden;height:505px;border:1px solid #adc5ab}.map svg{width:100%;height:100%}.map-tools{position:absolute;right:18px;top:19px;display:grid;gap:8px}.map-tools i{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-style:normal;box-shadow:0 3px 8px #0012}.floating-map{position:absolute;bottom:18px;left:18px;background:#fff;border:1px solid #e1ece0;border-radius:15px;max-width:275px;padding:16px;box-shadow:0 8px 25px #0011}.input{background:#fff;border:1px solid #D7E3D7;border-radius:12px;padding:14px 15px;color:#476555;min-height:46px}.setting{display:flex;align-items:center;gap:15px;border:1px solid var(--line);padding:14px;border-radius:12px;margin:9px 0;background:#fff}.setting.selected{border:2px solid #3AA76A;background:#F1FBF1}.optionIcon{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#ECF5EC;font-size:18px}.radio{margin-left:auto;border:2px solid #b6cabb;width:17px;height:17px;border-radius:100%}.selected .radio{background:var(--leaf);box-shadow:inset 0 0 0 3px #fff;border-color:var(--leaf)}.prognav{display:flex;gap:5px;width:310px;margin:10px 0 26px}.prognav i{height:6px;flex:1;background:#e4eae2;border-radius:4px}.prognav i.current{background:var(--leaf)}.crop{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;min-width:0}.crop .emoji{font-size:28px}.crop .caption{font-size:11px;color:#6d8173}.timeline{display:flex;align-items:stretch;gap:4px}.cropstep{border:1px solid #e2eadc;border-radius:13px;background:#FAFCF8;padding:12px;text-align:center;flex:1;min-width:0}.cropstep .ico{font-size:28px}.cropstep small{display:block;color:#738779;font-size:11px;margin-bottom:4px}.cropstep strong{display:block;font-size:14px;margin-top:5px}.between{align-self:center;color:#98AE9C;font-size:26px}.plan{border:1px solid #dce7dc;border-radius:20px;padding:22px;background:#fff;margin:13px 0}.plan.rec{border:2px solid #36AA66;background:#FBFFFA}.plan-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.metrics{display:flex;justify-content:space-between;gap:8px;margin-top:19px}.metric{background:#f3f8f1;border-radius:9px;padding:8px 12px;flex:1;font-size:12px;color:#567562;min-width:0}.metric strong{color:#2c6845;font-size:13px}.hr{border:none;border-top:1px solid var(--line);margin:20px 0}.statrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e9f0e9;font-size:13px}.statrow:last-child{border-bottom:0}.listline{display:flex;gap:13px;padding:12px 0;align-items:flex-start;border-bottom:1px solid #e8eee8}.listline:last-child{border-bottom:0}.bullet{background:#e7f6e9;color:#247f45;width:28px;height:28px;display:grid;place-items:center;border-radius:10px;flex-shrink:0}.cardcap{font-size:11px;letter-spacing:.3px;color:#728577;margin-bottom:8px}.statusdot{height:10px;width:10px;border-radius:50%;background:#3CB074;display:inline-block;vertical-align:middle;margin-right:5px}.statusdot.pending{background:#CED9CF}.statusdot.progress{background:#D9A13B}.chiprow{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#E9F4E7;padding:8px 13px;border-radius:99px;font-size:12px;font-weight:700;color:#356b4c}.alert{padding:13px 16px;background:#FFF8E8;border:1px solid #F5E4BB;border-radius:12px;color:#946f36;font-size:12px;line-height:1.65}.disclaimer{display:block;padding:12px 0;color:#8DA096;font-size:11px;letter-spacing:.1px}.hidden{display:none}.hero{background:linear-gradient(112deg,#123b2d,#1e5b41);color:#fff;border-radius:25px;min-height:625px;overflow:hidden;display:grid;grid-template-columns:1fr .95fr}.hero-copy{padding:55px 55px 42px}.hero h1{color:#fff;font-size:52px}.hero-copy p{color:#C7DECB;max-width:510px;line-height:1.7;font-size:17px}.hero-map{position:relative;align-self:stretch;background:linear-gradient(150deg,#73a75c,#b7ce70)}.hero-map:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(30deg,transparent,transparent 62px,#a9bc7e 62px,#a9bc7e 70px),repeating-linear-gradient(-33deg,transparent,transparent 95px,#e6ca6d70 95px,#e6ca6d70 102px);opacity:.85}.hero-map:after{content:'';position:absolute;bottom:0;left:0;width:100%;height:65%;background:linear-gradient(0deg,#184c32bb,transparent)}.hero-cta{margin:30px 0;display:flex;gap:12px}.hero-callout{position:absolute;z-index:1;background:#ffffffea;color:#173e32;padding:17px;border-radius:15px;bottom:50px;left:30px;box-shadow:0 12px 25px #0012;width:320px}.footer{position:fixed;bottom:0;width:100%;height:39px;background:#ffffffee;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:11px;color:#84998e;z-index:20}.screenshot-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.label-link{display:inline-block;border-radius:8px;background:#f0f5ef;padding:8px 11px;color:#668273;font-size:12px}.tablelike{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{padding:13px 11px;border-bottom:1px solid #e4eee4;text-align:left}th{background:#f6faf5;color:#597565;font-size:12px}.check{color:#24985c;font-weight:800}.neutral{color:#85948c}.grid-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.gallery-item{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;text-decoration:none;color:#17402f}.gallery-item:hover{border-color:#3a9}.gallery-item span{font-size:11px;color:#73887b;display:block;margin-top:7px}.detailtag{background:#eaf6ec;border-radius:8px;padding:6px 8px;font-size:11px;color:#397f54;font-weight:700}.evidence{background:#f7fbf7;border:1px solid #e3efe4;border-radius:12px;padding:13px;margin:9px 0;font-size:13px}.icon-circle{height:53px;width:53px;border-radius:15px;background:#e7f5ea;color:#239554;display:grid;place-items:center;font-size:25px}.priority-row{display:grid;grid-template-columns:190px 1fr 50px;gap:22px;align-items:center;margin:29px 0}.progress-track{height:10px;background:#e8eee6;border-radius:999px;position:relative}.progress-track>i{display:block;border-radius:999px;background:var(--leaf);height:10px}.progress-track>b{position:absolute;height:22px;width:22px;border:4px solid #fff;border-radius:50%;background:var(--leaf);top:-6px;box-shadow:0 1px 5px #0002}.stack{display:flex;height:19px;border-radius:99px;overflow:hidden}.stack span{display:block}.headline{display:flex;justify-content:space-between;align-items:center;margin:0 0 19px}.outline-card{border:1px solid #E0E9DB;background:#fff;border-radius:18px;padding:22px}.split-aside{display:grid;grid-template-columns:1.35fr .7fr;gap:24px}.sidebar{display:flex;flex-direction:column;gap:14px}.ar-wrap{direction:rtl;text-align:right}.ar-wrap .statrow,.ar-wrap .setting{direction:rtl}.ar-wrap .radio{margin-left:0;margin-right:auto}
</style></head><body><div id="app"></div><script>
const names=['Welcome','Select Field','Farm Questions','Priority Mixer','Analysis Progress','Rotation Explorer','Plan Details','Crop Customizer','Evaluate Changes','Compare Changes','Confirm Plan','Returning Home','Rotation Timeline','Field Insights','Plan Management','Settings'];
const ids=['01_welcome','02_select_field','03_farm_questions','04_priority_mixer','05_analysis_progress','06_rotation_explorer','07_plan_details','08_crop_customizer','09_evaluation_progress','10_compare_changes','11_confirm_plan','12_returning_home','13_rotation_timeline','14_field_insights','15_plan_management','16_settings'];
const t=(title,sub)=>`<div class="screenshot-title"><div><div class="eyebrow">FIELD SHIFT / UX REFERENCE</div><h1>${title}</h1><div class="lead">${sub}</div></div><div class="label-link">Concept design · desktop responsive web</div></div>`;
const btn=(txt='Continue',other=false)=>`<button class="${other?'outline':'btn'}">${txt}</button>`;
const block=(title,inner,cls='')=>`<div class="panel ${cls}"><h2>${title}</h2>${inner}</div>`;
const reason=(s,b='✓')=>`<div class="listline"><div class="bullet">${b}</div><div>${s}</div></div>`;
const year=(y,c,e)=>`<div class="cropstep"><small>${y}</small><div class="ico">${e}</div><strong>${c}</strong></div>`;
const timeline=(a=['Wheat','Chickpea','Barley'])=>{let E={'Wheat':'🌾','Chickpea':'🫘','Barley':'🌾','Lentil':'🌿','Faba bean':'🫘','Cover crop':'🌱','Sunflower':'🌻'};return `<div class="timeline">${a.map((c,i)=>`${i?'<div class="between">→</div>':''}${year('Year '+(i+1),c,E[c]||'🌱')}`).join('')}</div>`};
const mapSvg=()=>`<svg viewBox="0 0 820 500" preserveAspectRatio="xMidYMid slice"><rect width="820" height="500" fill="#A6C48B"/><g stroke="#C1CDAA" stroke-width="7">${Array.from({length:11},(_,i)=>`<path d="M ${-120+i*108} 0 L ${-220+i*112} 500"/>`).join('')}${Array.from({length:8},(_,i)=>`<path d="M 0 ${i*78-30} Q 350 ${i*77-80} 820 ${i*80-50}"/>`).join('')}</g><g opacity=".8">${Array.from({length:10},(_,i)=>`<path d="M ${i*80} 0l70 0 -80 500 -85 0z" fill="${['#93b46e','#d4ce86','#abc77b','#d6bd76','#8eac6a'][i%5]}"/>`).join('')}</g><path d="M -10 405 Q 300 285 810 345" fill="none" stroke="#e0ddc6" stroke-width="25"/><path d="M170 180 L380 90 L590 200 L540 390 L290 430 L100 300 Z" fill="#48a96b70" stroke="#ffffff" stroke-width="5"/>${[[170,180],[380,90],[590,200],[540,390],[290,430],[100,300]].map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="9" fill="#fff" stroke="#37b06c" stroke-width="4"/>`).join('')}</svg>`;
const mapUI=()=>`<div class="map">${mapSvg()}<div class="map-tools"><i>▣</i><i>⌖</i><i>＋</i><i>−</i></div><div class="floating-map"><div style="font-weight:850;margin-bottom:7px">Field boundary · editable</div><div class="muted" style="font-size:12px">6 points • valid polygon</div><div style="margin-top:9px;font-weight:800">Area calculated after drawing</div></div></div>`;
const screen={
 '01_welcome':()=>`<div class="hero"><div class="hero-copy"><div style="font-size:18px;margin-bottom:27px">🌿 Field Shift · NASA Space Apps 2026</div><div class="eyebrow" style="color:#b1e2ba">DATA-DRIVEN AGRICULTURE</div><h1>Plan smarter crop rotations with Earth data.</h1><p>Explore your field. Answer a few simple questions. Compare climate-aware rotation plans and choose the one that fits your priorities.</p><div class="hero-cta">${btn('Analyze My Field →')} ${btn('العربية',true)}</div><div style="display:flex;gap:23px;color:#d6e7d4;font-size:12px"><span>✓ Global field map</span><span>✓ Explained recommendations</span><span>✓ No account required</span></div></div><div class="hero-map"><div class="hero-callout"><strong>🌾 From your field to a clear decision</strong><div class="muted" style="margin-top:10px;font-size:12px">NASA Climate → Crop Suitability → Rotation Strategies</div></div></div></div>`,
 '02_select_field':()=>t('Select your field','Locate a field anywhere in the world, draw its exact outline and give it a name.')+`<div class="two"><div>${mapUI()}</div>${block('Field setup',`<div class="eyebrow">STEP 1 OF 4</div><p class="muted">Location permission centers the map only; it never chooses your farm automatically.</p><div class="input">⌕ &nbsp; Search city, village or area...</div><div style="height:18px"></div><div class="smallcard"><div class="cardcap">FIELD NAME</div><div class="input">My Field 01　✎</div><br><div class="cardcap">FIELD GEOMETRY</div><div style="font-weight:750">Polygon drawn · 6 vertices</div><div class="muted" style="font-size:12px;margin-top:7px">Area is calculated with geodesic geometry when confirmed.</div></div><div class="buttons">${btn('Confirm Field →')} ${btn('Edit Polygon',true)}</div>`)}</div>`,
 '03_farm_questions':()=>t('Tell us about your farm','Short, guided questions — one at a time. No long form and no manual soil pH entry.')+`<div class="two-even">${block('Question 2 of 5',`<div class="prognav"><i class="current"></i><i class="current"></i><i></i><i></i><i></i></div><h2>What did you grow over the last three agricultural years?</h2><p class="muted">More than one crop or season per year is supported.</p><div class="setting selected"><div class="optionIcon">🌾</div><div><strong>Year 1 · Wheat</strong><div class="muted" style="font-size:12px">Autumn/Winter season</div></div><div class="radio"></div></div><div class="setting"><div class="optionIcon">🌾</div><div><strong>Year 2 · Barley + other season</strong><div class="muted" style="font-size:12px">Add multiple seasonal crops</div></div><div class="radio"></div></div><div class="setting"><div class="optionIcon">🌱</div><div><strong>Year 3 · Fallow / Unknown</strong><div class="muted" style="font-size:12px">You may continue without full history</div></div><div class="radio"></div></div><div class="buttons">${btn('← Back',true)}${btn('Continue →')}</div>`)}${block('Questions we need',`${reason('<strong>Irrigation:</strong> rainfed/irrigated/mixed; method only if used.')}${reason('<strong>Previous crops:</strong> 3 agricultural years, possibly many seasons.')}${reason('<strong>Production purposes:</strong> sell, feed livestock, household food, soil cover.')}${reason('<strong>Optional:</strong> water limit, crop exclusions, equipment.') }<div class="alert" style="margin-top:23px">Climate, soil pH and land suitability are fetched or estimated automatically. No sensors required.</div>`,'pale')}</div>`,
 '04_priority_mixer':()=>t('Set your priorities','Move one slider; the other three adjust. The combined importance must stay exactly 100%.')+`<div class="two-even">${block('What matters most?',`<div class="stack"><span style="background:#4D87A8;width:35%"></span><span style="background:#299A61;width:30%"></span><span style="background:#D59A39;width:20%"></span><span style="background:#8a7eb5;width:15%"></span></div>${[['💧','Save water',35,'#4D87A8'],['🌱','Soil/rotation health',30,'#299A61'],['🌾','Yield reference',20,'#D59A39'],['🛡️','Reduce climate risk',15,'#8a7eb5']].map(([e,n,v,c])=>`<div class="priority-row"><strong>${e} &nbsp;${n}</strong><div class="progress-track"><i style="width:${v}%;background:${c}"></i><b style="left:calc(${v}% - 11px);background:${c}"></b></div><b style="text-align:right">${v}%</b></div>`).join('')}<div class="buttons">${btn('Start Analysis →')}${btn('Reset weights',true)}</div>`)}${block('Why these four objectives?',`${reason('Trade-offs will compare only indicators with evidence and verified methods.')}${reason('Farm purpose may include <b>Selling</b>, animal feed and home use.')}${reason('Profit optimization is <b>not implemented</b> because price/cost evidence is unavailable.')}${reason('Yield reference is not the same thing as net income.') }<div class="alert" style="margin-top:20px">MVP: 4 scientifically defensible priority categories. No fabricated money slider or ROI.</div>`,'pale')}</div>`,
 '05_analysis_progress':()=>t('Analyzing your field','Real processing stages, real source states. The results page opens when sufficient analysis finishes.')+`<div class="two-even">${block('Data collection & processing',`${[['✓','Field geometry & farm answers','Done'],['✓','NASA POWER · climate indicators','Received / cached actual response'],['…','SoilGrids · soil property estimates','Processing or unavailable'],['○','FAO GAEZ · local crop suitability','Pending map-layer match'],['○','Build and evaluate rotation plans','Pending crop candidates']].map(([e,a,b],i)=>`<div class="listline"><div class="bullet" style="background:${i<2?'#e7f6e9':'#F3F4EF'}">${e}</div><div><strong>${a}</strong><div class="muted" style="font-size:12px;margin-top:5px">${b}</div></div></div>`).join('')}<div class="alert" style="margin-top:21px">In a working app these badges must reflect live backend job statuses. There is no artificial 76% loading display.</div>`)}${block('Analysis inputs',`<div class="smallcard"><div class="cardcap">YOUR FIELD</div><strong>My Field 01</strong><div class="muted" style="font-size:12px;margin-top:6px">Polygon geometry · farmer-confirmed</div></div><div class="smallcard" style="margin-top:12px"><div class="cardcap">SOURCES</div><div>🛰️ NASA POWER</div><div>🌱 FAO GAEZ / crop knowledge</div><div>🧱 SoilGrids if available</div></div><div class="smallcard" style="margin-top:12px"><div class="cardcap">SCIENTIFIC PRINCIPLE</div><div class="muted" style="font-size:12px">Native map resolutions remain visible; small polygon does not imply meter-level climate or soil precision.</div></div>`,'pale')}</div>`,
 '06_rotation_explorer':()=>t('Explore rotation plans','Compare up to three feasible multi-season strategies built for your field and priorities.')+`<div class="three">${[['Plan A',['Wheat','Chickpea','Barley'],true,'Balanced crop diversity'],['Plan B',['Barley','Lentil','Wheat'],false,'Alternative sequence'],['Plan C',['Wheat','Cover crop','Barley'],false,'Soil-focused alternative']].map(([n,s,rec,desc])=>`<div class="plan ${rec?'rec':''}"><div class="plan-head"><h2 style="margin:0">${n}</h2>${rec?'<span class="badge">Recommended</span>':'<span class="badge grey">Alternative</span>'}</div>${timeline(s)}<p class="muted" style="font-size:12px;margin-top:20px">${desc}. Illustrative crops; actual plan requires local validated suitability.</p><div class="metrics"><div class="metric">💧 Water<br><strong>Evaluate</strong></div><div class="metric">🌱 Soil<br><strong>Evaluate</strong></div><div class="metric">🛡 Risk<br><strong>Evaluate</strong></div></div><div class="buttons">${btn('View Details →')}</div></div>`).join('')}</div><div class="disclaimer">Crops and ranks here are design examples, not field-specific agronomic prescriptions. Actual product may show fewer than 3 if constraints prevent valid plans.</div>`,
 '07_plan_details':()=>t('Plan A · Rotation details','Understand WHY this sequence was suggested before adopting or customizing it.')+`<div class="two-even">${block('Three-year rotation',`${timeline()}<hr class="hr"><h3>Potential benefits</h3>${reason('Diversifies the crop-family sequence compared with a cereal-only pattern.')}${reason('Legume may contribute to nitrogen cycling under suitable local conditions.')}${reason('Aligns with water/soil priorities only if supported by real analysis.')}<div class="buttons">${btn('Use This Plan ✓')}${btn('Customize Plan ✎',true)}</div>`)}${block('Evidence & trade-offs',`<div class="evidence"><strong>🛰 NASA POWER</strong><div class="muted">Climate analysis · show location, period, spatial support and unit in production</div></div><div class="evidence"><strong>🌾 FAO GAEZ</strong><div class="muted">Suitability and attainable yield under declared management/scenario</div></div><div class="evidence"><strong>🧱 SoilGrids</strong><div class="muted">Modeled soil property estimates; may be missing</div></div><div class="alert"><strong>Important risk:</strong> crop history and irrigation can invalidate a seemingly good sequence; re-check full rotation when changing crops.</div>`,'pale')}</div>`,
 '08_crop_customizer':()=>t('Customize Plan A','Change one, two or all crop slots. Only eligible replacement crops should appear.')+`<div class="two-even">${block('Your editable sequence',`${timeline(['Wheat','Chickpea','Barley'])}<div class="chiprow" style="margin-top:23px"><span class="chip">Year 1 · Wheat</span><span class="chip">Year 2 · Chickpea ✎</span><span class="chip">Year 3 · Barley</span></div><div class="alert" style="margin-top:26px">Draft changes are not active until you evaluate the whole new plan, compare, and confirm your choice.</div><div class="buttons">${btn('Evaluate Changes →')}${btn('Reset edits',true)}</div>`)}${block('Choose replacement · Year 2',`<div class="input">⌕ &nbsp; Search eligible crops...</div>${[['Lentil','Possible replacement · confirm model'],['Faba bean','Possible replacement · confirm model'],['Pea','Possible replacement · confirm model']].map((a,i)=>`<div class="setting ${i===0?'selected':''}"><div class="optionIcon">${i===0?'🌿':'🫘'}</div><div><strong>${a[0]}</strong><div class="muted" style="font-size:12px">${a[1]}</div></div><div class="radio"></div></div>`).join('')}<div class="alert">A “Similar Impact” badge may appear <b>only after actual comparable engine evaluation</b>; it is not a guarantee for crops of the same family.</div>`,'pale')}</div>`,
 '09_evaluation_progress':()=>t('Evaluating your modifications','Re-check the FULL crop sequence, not just the single replacement.')+`<div class="two-even">${block('Rotation re-analysis',`${[['✓','Check field, irrigation & crop compatibility'],['✓','Check season slots and neighbors'],['…','Compare water, soil, yield reference, climate risk'],['○','Prepare before/after evidence']].map(([e,n])=>reason(n,e)).join('')}<div class="bar"><i style="width:70%;background:linear-gradient(90deg,#43AD72,#A0D9AF)"></i></div><p class="muted" style="font-size:12px">Progress bar here is illustrative; real status is driven by backend stages, not a fabricated elapsed percentage.</p>`)}${block('Proposed crop changes',`${timeline(['Wheat','Lentil','Barley'])}<div class="smallcard" style="margin-top:22px"><div class="cardcap">CHANGED SLOT</div><b>Year 2:</b> Chickpea → Lentil</div><div class="smallcard" style="margin-top:10px"><div class="cardcap">SYSTEM RULE</div>Do not activate the modified version until the farmer explicitly approves it.</div>`,'pale')}</div>`,
 '10_compare_changes':()=>t('Compare original vs modified','Choose the plan you prefer after reading the advantages, limitations and evidence.')+`<div class="two-even">${block('Original · Plan A',`${timeline()}<div class="smallcard" style="margin-top:20px"><strong>Original saved reference</strong><div class="muted" style="font-size:12px;margin-top:8px">Wheat → Chickpea → Barley</div></div>`)}${block('Modified · Plan A',`${timeline(['Wheat','Lentil','Barley'])}<div class="smallcard" style="margin-top:20px"><strong>Current proposed draft</strong><div class="muted" style="font-size:12px;margin-top:8px">Wheat → Lentil → Barley</div></div>`,'pale')}</div><div class="panel" style="margin-top:20px"><h3>Evidence-based comparison (concept)</h3><table class="tablelike"><tr><th>Dimension</th><th>Original</th><th>Modified</th><th>Change assessment</th></tr><tr><td>Crop/season fit</td><td>Check verified data</td><td>Check verified data</td><td>Not yet calculated</td></tr><tr><td>Water requirement</td><td>Unknown until modeled</td><td>Unknown until modeled</td><td>Not comparable yet</td></tr><tr><td>Rotation-health proxy</td><td>Qualitative</td><td>Qualitative</td><td>Check family and residue context</td></tr><tr><td>Yield reference</td><td>GAEZ scenario needed</td><td>GAEZ scenario needed</td><td>Do not fabricate a %</td></tr></table><div class="buttons" style="justify-content:flex-end">${btn('Keep Original',true)}${btn('Use Modified Plan →')}</div></div>`,
 '11_confirm_plan':()=>t('Your rotation plan is saved','You can return to it, track the timeline, review evidence or start another analysis.')+`<div class="two-even">${block('✓ Plan saved successfully',`<div style="font-size:62px;color:#269454;margin:16px 0">◉</div><h2>Selected version: Modified Plan A</h2><p class="muted">Stored in SQLite for your anonymous browser. There is no user account or cross-device sync.</p>${timeline(['Wheat','Lentil','Barley'])}<div class="buttons">${btn('Go to My Farm →')}${btn('Review plan',true)}</div>`,'pale')}${block('What happens next?',`${reason('The same browser opens your <b>My Farm Home</b> the next time you return.')}${reason('You can change crop slots, re-evaluate or compare plan versions later.')}${reason('Actual planting/harvest progress is entered by the farmer or derived from validated dates—not live satellite detection.')}${reason('Protect the anonymous browser access key; clearing browser data can lose access.')}`)}</div>`,
 '12_returning_home':()=>t('Welcome back to your farm','Your selected plan and fields are already here. You do not need to repeat onboarding.')+`<div class="two">${block('My Field 01',`<div style="display:grid;grid-template-columns:220px 1fr;gap:19px;align-items:stretch"><div class="map" style="height:200px">${mapSvg()}</div><div><div class="cardcap">ACTIVE ROTATION PLAN</div><h2>Plan A · Modified</h2><span class="badge">Saved</span><p class="muted">Review your upcoming crop slots, status and environmental evidence. No live sensor claims.</p><div class="buttons">${btn('View My Plan →')}${btn('Edit Plan',true)}</div></div></div><hr class="hr"><h3>Crop sequence</h3>${timeline(['Wheat','Lentil','Barley'])}`)}<div class="sidebar">${block('Quick actions',`${reason('My Rotation Timeline — crop slots and manually confirmed status','📅')}${reason('Field Insights — climate/soil information and last update','☁')}${reason('Re-evaluate — when goals or field information changes','↻')}${reason('Add another field — no new account required','＋')}`,'pale')}${block('Last updated',`<div class="muted" style="font-size:13px">Real timestamp appears here after first successful analysis. No fake weekly forecast alerts.</div>`)}</div></div>`,
 '13_rotation_timeline':()=>t('My Rotation Timeline','Your adopted multi-year sequence, with planned stages and updates you report yourself.')+`<div class="panel"><div class="three">${[['Year 1','Wheat','🌾','Planned'],['Year 2','Lentil','🌿','Planned'],['Year 3','Barley','🌾','Planned']].map(([y,n,e,status])=>`<div class="smallcard"><span class="badge grey">${y}</span><div style="font-size:50px;margin:18px 0 10px">${e}</div><h2>${n}</h2><div class="cardcap">FARMER-REPORTED STATUS</div><div class="setting"><strong>${status}</strong><span style="margin-left:auto">⌄</span></div><div class="muted" style="font-size:12px">Local dates appear only when crop calendar data is verified.</div></div>`).join('')}</div></div><div class="panel" style="margin-top:20px"><h3>Activity log</h3>${reason('Log actual planting date when you plant; do not infer it from a satellite map.','✎')}${reason('Confirm harvest and actual yield if known; improves future comparisons.','✓')}${reason('Changing dates or crop status triggers a reminder to recheck the remaining sequence.','↻')}</div>`,
 '14_field_insights':()=>t('Field Intelligence','View all observations used to support recommendations, with sources and honest limitations.')+`<div class="kpis">${[['☁','Climate','NASA POWER'],['🧱','Soil','SoilGrids model'],['💧','Moisture','SMAP optional'],['🌱','Suitability','GAEZ scenario']].map(([e,n,s])=>`<div class="smallcard"><div style="font-size:27px;margin-bottom:10px">${e}</div><b>${n}</b><div class="muted" style="font-size:12px;margin-top:6px">${s}</div></div>`).join('')}</div><div class="two-even" style="margin-top:20px">${block('Data provenance',`<table class="tablelike"><tr><th>Indicator</th><th>Source</th><th>Availability</th></tr><tr><td>Temperature, rain</td><td>NASA POWER</td><td><span class="badge grey">Fetch real data</span></td></tr><tr><td>Soil pH / texture</td><td>ISRIC SoilGrids</td><td><span class="badge amber">May require prepared raster</span></td></tr><tr><td>Potential yield</td><td>FAO GAEZ v5</td><td><span class="badge grey">Scenario mapping</span></td></tr><tr><td>NDVI</td><td>Sentinel-2</td><td><span class="badge grey">Optional integration</span></td></tr></table>`)}${block('Important limitations',`${reason('Source resolution may be hundreds of meters or kilometers.', 'i')}${reason('Modeled soil values are not lab-measured values.', 'i')}${reason('Attainable yield is not your next harvest forecast.', 'i')}${reason('Missing data stays unknown rather than zero.', 'i')}`,'pale')}</div>`,
 '15_plan_management':()=>t('Manage your rotation plans','You can compare previous versions and make further changes safely.')+`<div class="two-even">${block('Saved plans',`<div class="setting selected"><div class="optionIcon">✓</div><div><b>Plan A · Modified</b><div class="muted" style="font-size:12px">Active plan · Wheat → Lentil → Barley</div></div><span class="badge">Active</span></div><div class="setting"><div class="optionIcon">⟲</div><div><b>Plan A · Original</b><div class="muted" style="font-size:12px">Reference version retained for comparison</div></div></div><div class="setting"><div class="optionIcon">▤</div><div><b>Plan B · Alternative</b><div class="muted" style="font-size:12px">Not adopted</div></div></div>`)}${block('Actions',`${reason('View selected crop timeline and source evidence.','▤')}${reason('Edit an eligible crop slot; changes remain draft.','✎')}${reason('Re-run analysis if irrigation, priorities, polygon or history change.','↻')}${reason('Adopt a different version only by explicit confirmation.','✓')}<div class="buttons">${btn('Edit Active Plan →')}${btn('View Previous',true)}</div>`,'pale')}</div>`,
 '16_settings':()=>t('Farm settings & language','Edit your farm context. Your data stays tied to this anonymous browser access key.')+`<div class="two-even">${block('Preferences',`<div class="setting selected"><div class="optionIcon">🌐</div><div><b>Language</b><div class="muted" style="font-size:12px">English / العربية (RTL supported)</div></div><span class="badge">EN</span></div><div class="setting"><div class="optionIcon">✎</div><div><b>Field name</b><div class="muted" style="font-size:12px">My Field 01</div></div></div><div class="setting"><div class="optionIcon">▣</div><div><b>Field boundary</b><div class="muted" style="font-size:12px">Changing polygon invalidates linked analysis</div></div></div><div class="setting"><div class="optionIcon">☷</div><div><b>Farm history & priorities</b><div class="muted" style="font-size:12px">Re-evaluation required after edits</div></div></div>`)}${block('Privacy & no-login limitations',`${reason('No user account, username, password, email or sign-in required.')}${reason('SQLite stores field/polygon, profile, analyses and chosen plan.')}${reason('Same-browser access via anonymous local key; clearing browser data can break restoration.')}${reason('Do not expose or publicly list other farmers\' polygons.') }<div class="alert" style="margin-top:22px">For a full product later, cross-device sync and recovery would need another explicitly agreed security design.</div>`,'pale')}</div>`
};
function render(){let args=new URLSearchParams(location.search),id=window.__SCREEN_NAME||args.get('screen')||'gallery',ar=window.__AR_MODE||args.get('lang')==='ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';let links=['Home','My Fields','My Plan','Insights'];let body=id==='gallery'?`<div class="eyebrow">FULL UI DESIGN REFERENCE</div><h1>All Field Shift screens</h1><p class="lead">Select any design reference to inspect a full desktop view. These are visual-only conceptual screens; all displayed example crops are placeholders pending field data.</p><div class="grid-gallery">${ids.map((k,i)=>`<a class="gallery-item" href="?screen=${k}"><b>${String(i+1).padStart(2,'0')} · ${names[i]}</b><span>${k}.png</span></a>`).join('')}</div>`:(screen[id]?screen[id]():`<h1>Unknown screen</h1>`);if(ar && id==='12_returning_home'){body=`<div class="screenshot-title"><div><div class="eyebrow">FIELD SHIFT / تجربة عربية</div><h1>مرحبا بعودتك إلى أرضك</h1><div class="lead">خطتك الزراعية المحفوظة جاهزة للمراجعة والتعديل، دون تسجيل دخول.</div></div><div class="label-link">تصور للواجهة · نسخة ويب</div></div><div class="two">${block('أرضي 01',`<div style="display:grid;grid-template-columns:220px 1fr;gap:19px;align-items:stretch"><div class="map" style="height:200px">${mapSvg()}</div><div><div class="cardcap">الخطة الزراعية المعتمدة</div><h2>الخطة أ · معدلة</h2><span class="badge">محفوظة</span><p class="muted">راجع المحاصيل المقبلة، وحالة الخطة، ومصادر البيانات المستخدمة.</p><div class="buttons">${btn('عرض خطتي')}${btn('تعديل الخطة',true)}</div></div></div><hr class="hr"><h3>تسلسل المحاصيل</h3><div class="timeline">${year('السنة الأولى','القمح','🌾')}<div class="between">←</div>${year('السنة الثانية','العدس','🌿')}<div class="between">←</div>${year('السنة الثالثة','الشعير','🌾')}</div>`)}<div class="sidebar">${block('إجراءات سريعة',`${reason('الجدول الزراعي — المواسم والعمليات المسجلة', '📅')}${reason('بيانات الأرض — المناخ والتربة ومصادرها','☁')}${reason('إعادة التقييم — عندما تتغير الظروف أو الأولويات','↻')}${reason('إضافة أرض أخرى — دون حساب مستخدم','＋')}`,'pale')}${block('آخر تحديث',`<div class="muted" style="font-size:13px">يظهر تاريخ التحديث الحقيقي بعد اكتمال أول تحليل ناجح. لا توجد تنبيهات مناخية آنية غير موثقة.</div>`)}</div></div>`;}document.getElementById('app').innerHTML=`<div class="topbar"><div class="logo"><div class="logo-dot"></div> Field Shift</div><div class="toplinks">${links.map((s,i)=>`<span class="${i===0?'active':''}">${s}</span>`).join('')}</div><div class="right-top"><span class="pill">EN · العربية</span><span class="pill">Web App</span></div></div><main class="main ${ar?'ar-wrap':''}">${body}</main><div class="footer"><span>FIELD SHIFT · NASA Space Apps 2026 · Visual reference only</span><span>Not a connected application · No real data or predicted outcomes</span></div>`;}
render();
</script></body></html>
